services:
  frontend:
    image: onyangochanda/compose-frontend
    ports: 
      - "5001:5001"
  backend:
    image: onyangochanda/compose-backend
    ports: 
      - "8080:8080"
    environment:
      - REQUEST_ORIGIN=http://localhost:5001
      - REDIS_HOST=redis

  redis:
    image: redis:8-alpine 